# Daily alert settings (lab/daily_alert.py, workflow .github/workflows/daily_alert.yml).
#
# After each US close the alert reports the four market regimes of DECISIONS 50 (SPY vs its
# 200-day average, yield curve, credit spread, VIX): on/off, whether they flipped today, how long
# the current state has held, and a plain-language reading of each value. It needs only SPY
# prices (yfinance) and the FRED series; no portfolio is simulated.

# Delivery. The GitHub issue needs no setup (the workflow's own token); you get GitHub's
# notification (email / mobile app). Telegram is used only when both repository secrets
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID exist.
issue_title: "📊 일일 알림"
mention: goodyyj617       # GitHub user mentioned in each comment so a notification is sent
only_on_change: false     # true = post only on a day when a regime flips
