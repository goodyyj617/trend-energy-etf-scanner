name: Backtest Only

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: data-publish-main
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Capture generated-data source revision
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=${SOURCE_SHA}" >> "${GITHUB_ENV}"
          echo "generated_data_source_sha=${SOURCE_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest only
        run: |
          python -m src.run_backtest_only

      - name: Preflight size check
        run: |
          echo "Data file sizes:"
          du -h docs/data/* | sort -h || true
          raw_outputs="docs/data/backtest_trades.csv docs/data/signal_diagnostics.csv docs/data/backtest_skipped.csv"
          for raw_output in $raw_outputs; do
            if [ -e "$raw_output" ]; then
              echo "Raw backtest output must not be committed: $raw_output"
              exit 1
            fi
          done
          too_large=$(find docs/data -type f -size +45M | tr '\n' ' ')
          if [ -n "$too_large" ]; then
            echo "Files larger than 45MB: $too_large"
            exit 1
          fi
          curve_count=$(find docs/data/backtest_portfolio_curves -type f -name '*.json' | wc -l)
          if [ "$curve_count" -gt 100 ]; then
            echo "Published portfolio curve cap exceeded: $curve_count"
            exit 1
          fi

      - name: Commit backtest data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          rm -f docs/data/backtest_trades.csv docs/data/signal_diagnostics.csv docs/data/backtest_skipped.csv
          raw_outputs="docs/data/backtest_trades.csv docs/data/signal_diagnostics.csv docs/data/backtest_skipped.csv"
          for raw_output in $raw_outputs; do
            if git ls-files --error-unmatch "$raw_output" >/dev/null 2>&1; then
              git add -u -- "$raw_output"
            fi
          done
          git add docs/data/backtest_summary.json docs/data/backtest_strategy_summary.csv docs/data/backtest_strategy_year_summary.csv
          git add docs/data/backtest_recent_trades.csv docs/data/signal_diagnostics_summary.csv docs/data/backtest_skipped_summary.csv
          git add docs/data/backtest_portfolio_strategy_summary.csv docs/data/backtest_portfolio_curve_manifest.json
          git add docs/data/backtest_benchmark_spy.json docs/data/backtest_portfolio_daily_returns.csv.gz
          git add -A docs/data/backtest_portfolio_curves
          if git diff --cached --quiet; then
            echo "No backtest data changes to publish."
            exit 0
          fi
          python scripts/verify_data_publish_base.py --source-sha "${SOURCE_SHA}"
          git commit -m "Update backtest data" -m "Generated-From: ${SOURCE_SHA}"
          GENERATED_PARENT_SHA="$(git rev-parse HEAD^)"
          echo "generated_data_parent_sha=${GENERATED_PARENT_SHA}"
          if [ "${GENERATED_PARENT_SHA}" != "${SOURCE_SHA}" ]; then
            echo "Generated commit parent mismatch: expected ${SOURCE_SHA}, observed ${GENERATED_PARENT_SHA}." >&2
            exit 1
          fi
          git push origin HEAD:main
