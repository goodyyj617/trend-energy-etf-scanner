name: Pull Request Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.11 / ${{ matrix.pandas }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pandas:
          - "pandas>=2.2,<2.3"
          - "pandas>=3.0,<4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt "${{ matrix.pandas }}"

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests

      - name: Run bounded test suite
        run: python -m pytest -q -W error::FutureWarning
